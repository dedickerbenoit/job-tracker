<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JobTracker</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="app">
      <!-- Header -->
      <header class="header">
        <h1>JobTracker</h1>
        <div class="header-actions">
          <span id="user-info" class="user-info hidden">
            <span id="user-name" class="user-name"></span>
            <button id="btn-logout" class="btn-icon" title="Déconnexion">
              ✕
            </button>
          </span>
          <button id="btn-settings" class="btn-icon" title="Paramètres">
            ⚙
          </button>
        </div>
      </header>

      <!-- Auth section -->
      <section id="section-auth" class="section hidden">
        <p class="text-muted">
          Connectez-vous pour sauvegarder vos candidatures.
        </p>
        <form id="auth-form">
          <div class="form-group">
            <label for="auth-email">Email</label>
            <input
              type="email"
              id="auth-email"
              required
              placeholder="votre@email.com"
            />
          </div>
          <div class="form-group">
            <label for="auth-password">Mot de passe</label>
            <input
              type="password"
              id="auth-password"
              required
              placeholder="Mot de passe"
            />
          </div>
          <p id="auth-error" class="text-error hidden"></p>
          <button
            type="submit"
            id="btn-login"
            class="btn btn-primary btn-block"
          >
            Se connecter
          </button>
        </form>
      </section>

      <!-- Job detection section -->
      <section id="section-job" class="section hidden">
        <div id="job-status" class="status-bar">
          <span id="status-icon" class="status-icon">○</span>
          <span id="status-text">Chargement...</span>
        </div>

        <button id="btn-scrape" class="btn btn-primary btn-block hidden">
          Scraper cette offre
        </button>

        <form id="job-form" class="hidden">
          <div class="form-group">
            <label for="field-title">Titre du poste</label>
            <input
              type="text"
              id="field-title"
              placeholder="Ex: Développeur Full Stack"
              required
            />
          </div>
          <div class="form-group">
            <label for="field-company">Entreprise</label>
            <input
              type="text"
              id="field-company"
              placeholder="Ex: Acme Corp"
              required
            />
          </div>
          <div class="form-group">
            <label for="field-location">Localisation</label>
            <input
              type="text"
              id="field-location"
              placeholder="Ex: Paris, France"
            />
          </div>
          <div class="form-group">
            <label for="field-url">URL de l'offre</label>
            <input type="url" id="field-url" placeholder="https://..." />
          </div>
          <div class="form-group">
            <label for="field-source">Source</label>
            <select id="field-source">
              <option value="linkedin">LinkedIn</option>
              <option value="indeed">Indeed</option>
              <option value="hellowork">HelloWork</option>
              <option value="other">Autre</option>
            </select>
          </div>
          <div class="form-group">
            <label for="field-status">Statut</label>
            <select id="field-status">
              <option value="applied">Candidaté</option>
              <option value="interview">Entretien</option>
              <option value="offer">Offre</option>
              <option value="rejected">Refusé</option>
              <option value="withdrawn">Retiré</option>
            </select>
          </div>
          <div class="form-group">
            <label for="field-description">Description</label>
            <textarea
              id="field-description"
              rows="4"
              placeholder="Description du poste..."
            ></textarea>
          </div>
          <div class="form-group">
            <label for="field-notes">Notes personnelles</label>
            <textarea
              id="field-notes"
              rows="2"
              placeholder="Vos notes..."
            ></textarea>
          </div>
          <button
            type="submit"
            id="btn-submit"
            class="btn btn-primary btn-block"
          >
            Sauvegarder
          </button>
        </form>
      </section>

      <!-- Manual entry -->
      <section id="section-manual" class="section hidden">
        <button id="btn-manual" class="btn btn-secondary btn-block">
          Saisie manuelle
        </button>
      </section>

      <!-- Settings panel -->
      <section id="section-settings" class="section hidden">
        <h2>Paramètres</h2>
        <div class="settings-group">
          <h3>Sites activés</h3>
          <label class="checkbox-label">
            <input type="checkbox" id="setting-linkedin" checked />
            LinkedIn
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="setting-indeed" checked />
            Indeed
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="setting-hellowork" checked />
            HelloWork
          </label>
        </div>
        <button id="btn-settings-back" class="btn btn-secondary btn-block">
          Retour
        </button>
      </section>

      <!-- Toast notification -->
      <div id="toast" class="toast hidden"></div>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
