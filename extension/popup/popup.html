<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JobTracker</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="app">
      <!-- Header -->
      <header class="header">
        <div style="display:flex;align-items:center;gap:6px">
          <img src="../assets/icon-48.png" alt="" width="24" height="24" />
          <h1>JobTracker</h1>
        </div>
        <div class="header-actions">
          <span id="user-info" class="user-info hidden">
            <span id="user-name" class="user-name"></span>
            <button id="btn-dashboard" class="btn-icon">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect width="7" height="9" x="3" y="3" rx="1" />
                <rect width="7" height="5" x="14" y="3" rx="1" />
                <rect width="7" height="9" x="14" y="12" rx="1" />
                <rect width="7" height="5" x="3" y="16" rx="1" />
              </svg>
            </button>
          </span>
          <button id="btn-settings" class="btn-icon">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"
              />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
          <button id="btn-logout" class="btn-icon btn-logout hidden">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <polyline points="16 17 21 12 16 7" />
              <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
          </button>
        </div>
      </header>

      <!-- Auth section -->
      <section id="section-auth" class="section hidden">
        <p id="auth-intro" class="text-muted"></p>
        <form id="auth-form">
          <div class="form-group">
            <label id="label-auth-email" for="auth-email"></label>
            <input type="email" id="auth-email" required />
          </div>
          <div class="form-group">
            <label id="label-auth-password" for="auth-password"></label>
            <input type="password" id="auth-password" required />
          </div>
          <p id="auth-error" class="text-error hidden"></p>
          <button
            type="submit"
            id="btn-login"
            class="btn btn-primary btn-block"
          ></button>
        </form>
      </section>

      <!-- Job detection section -->
      <section id="section-job" class="section hidden">
        <div id="job-status" class="status-bar">
          <span id="status-icon" class="status-icon">○</span>
          <span id="status-text"></span>
        </div>

        <button
          id="btn-scrape"
          class="btn btn-primary btn-block hidden"
        ></button>

        <form id="job-form" class="hidden">
          <div class="form-group">
            <label id="label-field-title" for="field-title"></label>
            <input type="text" id="field-title" required />
          </div>
          <div class="form-group">
            <label id="label-field-company" for="field-company"></label>
            <input type="text" id="field-company" required />
          </div>
          <div class="form-group">
            <label id="label-field-location" for="field-location"></label>
            <input type="text" id="field-location" />
          </div>
          <div class="form-group">
            <label id="label-field-url" for="field-url"></label>
            <input type="url" id="field-url" />
          </div>
          <div class="form-group">
            <label id="label-field-source" for="field-source"></label>
            <select id="field-source">
              <!-- Options generated dynamically from constants.js -->
            </select>
          </div>
          <div class="form-group">
            <label id="label-field-status" for="field-status"></label>
            <select id="field-status">
              <!-- Options generated dynamically from constants.js -->
            </select>
          </div>
          <div class="form-group">
            <label id="label-field-description" for="field-description"></label>
            <textarea id="field-description" rows="4"></textarea>
          </div>
          <div class="form-group">
            <label id="label-field-notes" for="field-notes"></label>
            <textarea id="field-notes" rows="2"></textarea>
          </div>
          <button
            type="submit"
            id="btn-submit"
            class="btn btn-primary btn-block"
          ></button>
          <button
            type="button"
            id="btn-open-dashboard"
            class="btn btn-secondary btn-block hidden"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              style="margin-right: 6px"
            >
              <rect width="7" height="9" x="3" y="3" rx="1" />
              <rect width="7" height="5" x="14" y="3" rx="1" />
              <rect width="7" height="9" x="14" y="12" rx="1" />
              <rect width="7" height="5" x="3" y="16" rx="1" />
            </svg>
            <span id="btn-open-dashboard-label"></span>
          </button>
        </form>
      </section>

      <!-- Manual entry -->
      <section id="section-manual" class="section hidden">
        <button id="btn-manual" class="btn btn-secondary btn-block"></button>
      </section>

      <!-- Settings panel -->
      <section id="section-settings" class="section hidden">
        <h2 id="settings-title"></h2>
        <div class="settings-group">
          <h3 id="settings-enabled-sites"></h3>
          <label class="checkbox-label">
            <input type="checkbox" id="setting-linkedin" checked />
            LinkedIn
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="setting-indeed" checked />
            Indeed
          </label>
        </div>
        <button
          id="btn-settings-back"
          class="btn btn-secondary btn-block"
        ></button>
      </section>

      <!-- Toast notification -->
      <div id="toast" class="toast hidden"></div>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
